<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎光临我的小宇宙 ✨</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: #fff9f4;
  background-image: radial-gradient(#fde2d0 1.5px, transparent 1.5px);
  background-size: 20px 20px;
  color: #5c4d4d;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 30px 16px;
}

.profile-card {
  background: #ffffff;
  max-width: 440px;
  width: 100%;
  padding: 30px 24px;
  border-radius: 28px;
  box-shadow: 0 12px 30px rgba(255, 183, 165, 0.15);
  border: 3px solid #ffefe8;
  text-align: center;
}

.avatar-wrapper {
  position: relative;
  width: 90px;
  height: 90px;
  margin: 0 auto 14px;
}

.avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: linear-gradient(135deg, #ffd3b6, #ffaaa5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: 0 6px 14px rgba(255, 170, 165, 0.35);
  border: 4px solid #ffffff;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.avatar:hover {
  transform: rotate(10deg) scale(1.08);
}

.status-badge {
  position: absolute;
  bottom: 0;
  right: 0px;
  background: #a8e6cf;
  color: #2b614d;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 12px;
  border: 2px solid #ffffff;
}

h1 {
  font-size: 20px;
  color: #4a3b32;
  margin-bottom: 4px;
  font-weight: 700;
}

.subtitle {
  font-size: 13px;
  color: #b59b92;
  margin-bottom: 6px;
}

/* 便签卡片区域 */
.info-section {
  background: #fffaf7;
  border: 1.5px dashed #ffd8ca;
  border-radius: 20px;
  padding: 16px 18px;
  margin-top: 16px;
  text-align: left;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: #d96b52;
  margin-bottom: 10px;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.info-item {
  background: #ffffff;
  padding: 8px 12px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 6px rgba(255, 183, 165, 0.1);
}

.info-label {
  font-size: 12px;
  color: #a8928a;
}

.info-value {
  font-size: 12px;
  font-weight: 600;
  color: #5c4d4d;
}

.hobbies-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.hobby-pill {
  background: #ffffff;
  color: #6b534b;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid #ffe1d5;
  box-shadow: 0 2px 5px rgba(255, 183, 165, 0.08);
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hobby-pill:hover {
  transform: translateY(-2px) scale(1.04);
  background: #fff0eb;
  color: #e06d53;
}

/* 🎰 猫咪扭蛋机互动区域 */
.gacha-widget {
  background: #fffaf7;
  border: 1.5px dashed #ffd8ca;
  border-radius: 20px;
  padding: 16px;
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.gacha-cat-header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.cat-face {
  font-size: 26px;
  animation: catNod 3s ease-in-out infinite;
  display: inline-block;
}

@keyframes catNod {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px) rotate(2deg); }
}

.gacha-bubble {
  background: #ffffff;
  font-size: 11px;
  color: #d96b52;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
  border: 1px solid #ffe1d5;
  box-shadow: 0 2px 6px rgba(255, 183, 165, 0.12);
}

.gacha-machine {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  width: 130px;
}

.gacha-globe {
  width: 100px;
  height: 85px;
  background: rgba(255, 255, 255, 0.7);
  border: 3px solid #ffefe8;
  border-radius: 50px 50px 30px 30px;
  box-shadow: inset 0 4px 10px rgba(255, 183, 165, 0.25), 0 4px 12px rgba(255, 183, 165, 0.15);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(2px);
}

.capsule {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  position: absolute;
  box-shadow: inset -2px -2px 0 rgba(0,0,0,0.08);
}
.c1 { background: #ffaaa5; bottom: 8px; left: 16px; }
.c2 { background: #ffd3b6; bottom: 12px; left: 40px; }
.c3 { background: #a8e6cf; bottom: 10px; left: 62px; }
.c4 { background: #dcedc1; bottom: 26px; left: 26px; }
.c5 { background: #ff8b94; bottom: 28px; left: 52px; }

.gacha-base {
  width: 116px;
  height: 48px;
  background: linear-gradient(180deg, #ff9a8b 0%, #ff6a88 100%);
  border-radius: 12px 12px 20px 20px;
  margin-top: -6px;
  position: relative;
  box-shadow: 0 6px 14px rgba(255, 106, 136, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
}

.gacha-slot {
  width: 32px;
  height: 18px;
  background: #3e2e2b;
  border-radius: 8px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}

.cat-paw-lever {
  position: absolute;
  right: -24px;
  bottom: 8px;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  transform-origin: left center;
  transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.cat-paw-lever:hover {
  transform: rotate(-12deg) scale(1.1);
}

.cat-paw-lever:active, .paw-pressing {
  transform: rotate(28deg) scale(0.95) !important;
}

.paw-pad {
  font-size: 28px;
  filter: drop-shadow(0 3px 5px rgba(255, 106, 136, 0.35));
}

.globe-shaking .capsule {
  animation: capsuleBounce 0.35s ease-in-out infinite alternate;
}

@keyframes capsuleBounce {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-16px) rotate(45deg); }
}

/* 💌 抽签拍立得弹窗 */
.gacha-modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(92, 77, 77, 0.4);
  backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.gacha-modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.fortune-card {
  background: #ffffff;
  border-radius: 20px;
  padding: 24px 20px;
  max-width: 300px;
  width: 85%;
  text-align: center;
  position: relative;
  box-shadow: 0 15px 35px rgba(255, 170, 165, 0.3);
  border: 3px solid #ffefe8;
  transform: scale(0.7) rotate(-5deg);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.gacha-modal-overlay.active .fortune-card {
  transform: scale(1) rotate(0deg);
}

.card-pin {
  font-size: 20px;
  margin-top: -12px;
  margin-bottom: 6px;
}

.fortune-badge {
  display: inline-block;
  background: #ffe3d9;
  color: #e06d53;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 12px;
  margin-bottom: 8px;
}

.fortune-title {
  font-size: 16px;
  font-weight: 700;
  color: #4a3b32;
  margin-bottom: 8px;
}

.fortune-content {
  font-size: 13px;
  color: #6b534b;
  line-height: 1.6;
  margin-bottom: 18px;
}

.fortune-close-btn {
  background: linear-gradient(135deg, #ff9a8b 0%, #ff6a88 100%);
  color: #fff;
  border: none;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 24px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 106, 136, 0.3);
  transition: transform 0.2s;
}

.fortune-close-btn:hover {
  transform: scale(1.05);
}

/* 底部按钮外层居中容器 */
.action-section {
  margin-top: 24px;
}

.cute-jump-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  background: linear-gradient(135deg, #ff9a8b 0%, #ff6a88 100%);
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 28px;
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(255, 106, 136, 0.3);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.cute-jump-btn:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 22px rgba(255, 106, 136, 0.42);
}

.cute-jump-btn:hover .arrow-icon {
  transform: translateX(4px);
}

.arrow-icon {
  display: inline-block;
  transition: transform 0.2s ease;
}

.cute-jump-btn:active {
  transform: translateY(0) scale(0.97);
}

/* 昼夜切换悬浮胶囊 */
.theme-toggle-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(8px);
  border: 2px solid #ffefe8;
  border-radius: 999px;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(255, 183, 165, 0.25);
  z-index: 900;
  font-family: inherit;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.theme-toggle-btn:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 10px 24px rgba(255, 183, 165, 0.35);
}

.theme-icon {
  font-size: 16px;
  display: inline-block;
  transition: transform 0.4s ease;
}

.theme-text {
  font-size: 12px;
  font-weight: 700;
  color: #5c4d4d;
}

/* 全局平滑换装过渡 */
body, .profile-card, .info-section, .info-item, .hobby-pill, .fortune-card, .gacha-widget {
  transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
}

/* 🌙 深夜模式专用皮肤（清晰通透版） */
body.night-mode {
  background-color: #21191f;
  background-image: radial-gradient(#3a2e37 1.5px, transparent 1.5px);
  color: #f7eef3;
}

body.night-mode .theme-toggle-btn {
  background: rgba(54, 44, 54, 0.9);
  border-color: #7b6277;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}

body.night-mode .theme-text {
  color: #ffffff !important;
}

body.night-mode .profile-card {
  background: #2d242c;
  border-color: #4e3a4b;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
}

body.night-mode .info-section,
body.night-mode .gacha-widget {
  background: #251d24;
  border-color: #5c4558;
}

body.night-mode h1 {
  color: #ffffff !important;
}

body.night-mode .subtitle {
  color: #e5d4de !important; /* 副标题明亮粉灰 */
}

  color: #ff9a8b !important;
}

/* 🌟 核心提亮：档案小方块 */

}

  color: #f0cddb !important; /* 标签：软糯奶粉色，极清晰 */
}

}

  background: #3c303b !important;

}

  background: #523f50 !important;
  color: #ffb4a2 !important;
}

/* 状态与气泡 */
body.night-mode .status-badge {
  background: #73528d !important;
  color: #ffffff !important;
}

body.night-mode .gacha-bubble {
  background: #3c303b !important;
  color: #ffccd5 !important;
  border-color: #6a5065 !important;
}

/* 弹窗小卡片夜间高亮 */

  background: #332731;
  border-color: #5a4256;
}

body.night-mode .fortune-title {
  color: #ffffff !important;
}

body.night-mode .fortune-content {
  color: #ebdbe4 !important;
}
</style>
</head>

  { fortune: "中吉", title: "朋友圈仅一人可见", content: "今日宜：发一条莫名其妙的胡言乱语朋友圈，让暗中观察你的人抓耳挠腮去猜。" },
  { fortune: "大凶", title: "群聊冷场王", content: "今天你发在群里的冷笑话有可能会让整个群陷入长达半小时的死寂，慎言！" },
  { fortune: "吉", title: "精神状态外包", content: "今天把‘我很正常’的面具摘下来五分钟，跟最好的朋友比赛谁发癫更在行。" },
  { fortune: "小吉", title: "偷听心声耳塞", content: "今天少关心别人在想什么，大部分人脑子里其实也只有‘中午吃啥’的弹幕而已。" }
];

let isRolling = false;

function drawGacha() {
  if (isRolling) return;
  isRolling = true;

  const lever = document.getElementById('pawLever');
  const globe = document.getElementById('gachaGlobe');

  lever.classList.add('paw-pressing');
  globe.classList.add('globe-shaking');

  setTimeout(() => {
    lever.classList.remove('paw-pressing');
    globe.classList.remove('globe-shaking');
    isRolling = false;

    const randomIndex = Math.floor(Math.random() * GACHA_LIST.length);
    const item = GACHA_LIST[randomIndex];

    document.getElementById('cardFortune').innerText = item.fortune;
    document.getElementById('cardTitle').innerText = item.title;
    document.getElementById('cardContent').innerText = item.content;

    document.getElementById('gachaModal').classList.add('active');
  }, 600);
}

function closeGachaModal(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('fortune-close-btn')) {
    return;
  }
  document.getElementById('gachaModal').classList.remove('active');
}

function toggleTheme() {
  const isNight = document.body.classList.toggle('night-mode');
  localStorage.setItem('lulu_theme', isNight ? 'night' : 'day');
  updateThemeView(isNight);
}

function updateThemeView(isNight) {
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  const badge = document.querySelector('.status-badge');
  const bubble = document.querySelector('.gacha-bubble');
  const subtitle = document.querySelector('.subtitle');

  if (isNight) {
    if (icon) {
      icon.innerText = "🌙";
      icon.style.transform = "rotate(360deg)";
    }
    if (text) text.innerText = "深夜";
    if (badge) badge.innerText = "做梦中 💤";
    if (bubble) bubble.innerText = "嘘…小猫睡着了，轻点戳";
    if (subtitle) subtitle.innerText = "野生夜猫子已耗尽电量 Zzz";
  } else {
    if (icon) {
      icon.innerText = "☀️";
      icon.style.transform = "rotate(0deg)";
    }
    if (text) text.innerText = "白昼";
    if (badge) badge.innerText = "在线中 ✨";
    if (bubble) bubble.innerText = "戳我爪爪，赐你一签～";
    if (subtitle) subtitle.innerText = "今天也在认真摸鱼Zzz";
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('lulu_theme');
  if (savedTheme === 'night') {
    document.body.classList.add('night-mode');
    updateThemeView(true);
  }
});
</script>
