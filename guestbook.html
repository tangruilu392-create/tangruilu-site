<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 悄悄话投递站</title>
  
  <!-- 引入 Supabase 稳定公共库 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/supabase/2.39.8/supabase.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fff9f4;
      background-image: radial-gradient(#fde2d0 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      color: #5c4d4d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 16px;
    }

    /* 欢迎弹窗遮罩 */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 245, 240, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .welcome-card {
      background: #ffffff;
      padding: 36px 30px;
      border-radius: 28px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      border: 3px solid #ffefe8;
      box-shadow: 0 15px 35px rgba(255, 170, 165, 0.25);
      transform: scale(1);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .welcome-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .welcome-title {
      font-size: 17px;
      font-weight: 700;
      color: #4a3b32;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .welcome-text {
      font-size: 14px;
      color: #7a635a;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .enter-btn {
      background: linear-gradient(135deg, #ff9a8b 0%, #ff6a88 100%);
      color: white;
      border: none;
      padding: 11px 32px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 106, 136, 0.3);
      transition: all 0.25s;
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 20px rgba(255, 106, 136, 0.4);
    }

    .overlay-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* 留言板常规布局 */
    .board-card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 28px 24px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(255, 183, 165, 0.15);
      border: 3px solid #ffefe8;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      color: #ff8577;
      background: #fff0eb;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #ffe3d9;
      transform: translateX(-3px);
    }

    h2 {
      font-size: 18px;
      color: #4a3b32;
    }

    .form-group {
      margin-bottom: 12px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ffe1d5;
      background: #fffaf7;
      border-radius: 14px;
      font-size: 13px;
      color: #5c4d4d;
      outline: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #ff9a8b;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 154, 139, 0.2);
    }

    textarea {
      resize: none;
      height: 80px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff9a8b 0%, #ff6a88 100%);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 106, 136, 0.25);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 106, 136, 0.35);
    }

    .messages-container {
      margin-top: 24px;
      border-top: 1.5px dashed #ffd8ca;
      padding-top: 18px;
    }

    .list-title {
      font-size: 13px;
      color: #b59b92;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .msg-card {
      background: #fffaf7;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #ffefe8;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .msg-author {
      font-weight: 600;
      color: #e06d53;
    }

    .msg-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-time {
      color: #c4aca3;
      font-size: 11px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ecd5cc;
      font-size: 14px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      color: #ff6a88;
      transform: scale(1.2);
    }

    .msg-content {
      font-size: 13px;
      color: #5c4d4d;
      line-height: 1.5;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- 欢迎弹窗 -->
  <div class="welcome-overlay" id="welcomeModal">
    <div class="welcome-card">
      <div class="welcome-icon">🔒</div>
      <div class="welcome-title">欢迎来到悄悄话信箱</div>
      <div class="welcome-text">
        你可以在这里留下所有的秘密哦~
      </div>
      <button class="enter-btn" onclick="enterBoard()">开启信箱 ( ੭˙꒳˙)੭</button>
    </div>
  </div>

  <!-- 留言板主体 -->
  <div class="board-card">
    <div class="top-bar">
      <h2>💌 悄悄话信箱</h2>
      <a href="index.html" class="back-btn">← 回主页</a>
    </div>

    <div class="form-group">
      <input type="text" id="nickname" placeholder="留下你的可爱称呼 (例如: 藏着秘密的猫)">
    </div>
    <div class="form-group">
      <textarea id="message" placeholder="在这里写下一句今天的心情或悄悄话吧～"></textarea>
    </div>
    <button class="submit-btn" onclick="sendMsg()">投递留言 📮</button>

    <div class="messages-container">
      <div class="list-title">
        <span>📮 信箱留言</span>
        <span id="msgCount">正在读取...</span>
      </div>
      <div id="messagesList"></div>
    </div>
  </div>

  <script>
    function enterBoard() {
      const modal = document.getElementById('welcomeModal');
      if (modal) {
        modal.classList.add('overlay-hidden');
      }
    }

    const ADMIN_PASSWORD = "lulu";

    const SUPABASE_URL = 'https://urnmqzcmmvaeffeyxfvs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVybm1xemNtbXZhZWZmZXl4ZnZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTc3MTUsImV4cCI6MjEwNzQ3MzcxNX0.ejghw_9Ae10sQ-5cpus2LzM4v14JtY4oJ2cmv09zzLQ';

    let supabase = null;

    function getSupabaseClient() {
      if (!supabase && window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return supabase;
    }

    function formatDateTime(dateStr) {
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${day} ${hours}:${minutes}`;
    }

    function renderCard(item) {
      const author = item.author || "匿名小可爱";
      const text = item.content || "";
      const timeStr = formatDateTime(item.created_at);

      const itemDiv = document.createElement('div');
      itemDiv.className = 'msg-card';
      itemDiv.innerHTML = `
        <div class="msg-header">
          <span class="msg-author">${author}</span>
          <div class="msg-header-right">
            <span class="msg-time">${timeStr}</span>
            <button class="delete-btn" onclick="deleteMsg(${item.id})" title="删除留言">×</button>
          </div>
        </div>
        <div class="msg-content">${text}</div>
      `;
      return itemDiv;
    }

    async function loadMessages() {
      const container = document.getElementById('messagesList');
      const countLabel = document.getElementById('msgCount');

      const client = getSupabaseClient();
      if (!client) {
        container.innerHTML = '<div style="text-align:center;font-size:12px;color:#ff9a8b;padding:10px;">云端库未能连接，刷新试试看～</div>';
        return;
      }

      container.innerHTML = '<div style="text-align:center;font-size:12px;color:#c4aca3;padding:10px;">正在拆阅信件...</div>';

      try {
        const { data: messages, error } = await client
          .from('guestbook')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        container.innerHTML = '';
        countLabel.innerText = `${messages.length} 条留言`;

        if (messages.length === 0) {
          container.innerHTML = '<div style="text-align:center;font-size:12px;color:#c4aca3;padding:10px;">信箱空空的，快来投递第一封信吧～</div>';
          return;
        }

        messages.forEach(item => {
          container.appendChild(renderCard(item));
        });
      } catch (err) {
        console.error("加载留言失败:", err);
        container.innerHTML = '<div style="text-align:center;font-size:12px;color:#ff9a8b;padding:10px;">信件迷路了，刷新试试看～</div>';
      }
    }

    async function sendMsg() {
      const nameInput = document.getElementById('nickname');
      const msgInput = document.getElementById('message');

      const name = nameInput.value.trim() || "匿名小可爱";
      const text = msgInput.value.trim();

      if (!text) {
        alert("写点悄悄话再投递吧～");
        return;
      }

      const client = getSupabaseClient();
      if (!client) {
        alert("云端连接还在准备中，请稍后再投递～");
        return;
      }

      const submitBtn = document.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "正在塞进信箱... 📮";

      try {
        const { error } = await client
          .from('guestbook')
          .insert([{ author: name, content: text }]);

        if (error) throw error;

        msgInput.value = '';
        loadMessages();
      } catch (err) {
        console.error("发送失败:", err);
        alert("网络开小差了，稍后再试～");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "投递留言 📮";
      }
    }

    async function deleteMsg(id) {
      const pwd = prompt("🌸 触发站长暗门，请输入管理密码：");
      if (pwd === null) return;

      if (pwd !== ADMIN_PASSWORD) {
        alert("密码不对哦，可不能乱动别人的信件～");
        return;
      }

      const client = getSupabaseClient();
      if (!client) {
        alert("云端连接尚未就绪，稍后再试～");
        return;
      }

      try {
        const { error } = await client
          .from('guestbook')
          .delete()
          .eq('id', id);

        if (error) throw error;

        loadMessages();
      } catch (err) {
        console.error("删除失败:", err);
        alert("删除失手啦，稍后再试～");
      }
    }

    window.onload = function() {
      const timer = setInterval(() => {
        if (window.supabase) {
          clearInterval(timer);
          loadMessages();
        }
      }, 300);

      setTimeout(() => {
        clearInterval(timer);
        if (!window.supabase) {
          const container = document.getElementById('messagesList');
          if (container) {
            container.innerHTML = '<div style="text-align:center;font-size:12px;color:#ff9a8b;padding:10px;">云端库未能连接，刷新试试看～</div>';
          }
        }
      }, 5000);
    };
  </script>
</body>
</html>
